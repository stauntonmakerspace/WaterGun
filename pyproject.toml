[project]
name = "watergun"
version = "0.2.0"
description = "A project for controlling a water gun using computer vision"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Nile Walker", email = "nilezwalker@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "aiortc>=1.13.0",
    "flask>=3.1.1",
    "flask-socketio>=5.5.1",
    # "boxmot>=12.0.2",
    "numpy>=1.26.4",
    "opencv-python>=4.11.0.86",
    "pillow>=11.1.0",
    "pip>=25.0.1",
    "pygame>=2.6.1",
    "pyserial>=3.5",
    "python-dotenv>=1.0.1",
    "scipy>=1.13.1",
    "setuptools>=77.0.3",
    "tk>=0.1.0",
    # "ultralytics>=8.3.94",
    "websockets>=15.0.1",
]

[project.urls]
Homepage = "https://github.com/stauntonmakerspace/WaterGun"

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# packages = ["watergun"]
# include-package-data = true

[tool.setuptools.package-data]
watergun = ["assets/*"]
